<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
    input { width: 60px; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; margin: 10px; font-size: 16px; }
    #result { font-size: 18px; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Simple Calculator</h2>
  <input type="number" id="num1" placeholder="Num 1">
  <select id="operation">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
  </select>
  <input type="number" id="num2" placeholder="Num 2">
  <button onclick="calculate()">Calculate</button>

  <div id="result"></div>

  <script>
    function calculate() {
      let num1 = parseFloat(document.getElementById('num1').value);
      let num2 = parseFloat(document.getElementById('num2').value);
      let operation = document.getElementById('operation').value;
      let result;

      try {
        if (isNaN(num1) || isNaN(num2)) throw "Invalid input!";
        if (operation === "/" && num2 === 0) throw "Cannot divide by zero!";
        
        switch (operation) {
          case "+": result = num1 + num2; break;
          case "-": result = num1 - num2; break;
          case "*": result = num1 * num2; break;
          case "/": result = num1 / num2; break;
          default: throw "Unknown operation!";
        }
        
        document.getElementById('result').innerText = `Result: ${result}`;
      } catch (error) {
        document.getElementById('result').innerText = `Error: ${error}`;
      } finally {
        console.log("Calculation complete.");
      }
    }
  </script>
</body>
</html>
