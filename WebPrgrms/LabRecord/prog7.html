<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jQuery and jQuery UI Example</title>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #slider { margin: 20px 0; }
  </style>
</head>
<body>

<h2>jQuery UI Slider and Accordion</h2>

<div id="accordion">
  <h3>Section 1</h3>
  <div>
    <p>This is section 1 content.</p>
  </div>
  <h3>Section 2</h3>
  <div>
    <p>This is section 2 content.</p>
  </div>
</div>

<div id="slider"></div>
<p>Slider Value: <span id="sliderValue"></span></p>

<script>
  $(function() {
    $("#accordion").accordion();
    $("#slider").slider({
      min: 0, max: 100, value: 50,
      slide: function(event, ui) { $("#sliderValue").text(ui.value); }
    });
    $("#sliderValue").text($("#slider").slider("value"));
  });
</script>

</body>
</html>
