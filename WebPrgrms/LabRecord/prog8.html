<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jQuery UI Interactive Page</title>
 
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>  
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #draggable { width: 100px; height: 100px; background: #3498db; color: white; text-align: center; line-height: 100px; cursor: move; }
    #droppable { width: 150px; height: 150px; background: #ecf0f1; margin-top: 20px; text-align: center; line-height: 150px; }
  </style>
</head>
<body>

<h2>jQuery UI Example</h2>

<div id="draggable">Drag Me</div>
<div id="droppable">Drop Here</div>

<p>Date: <input type="text" id="datepicker"></p>
<button id="toggle">Toggle Droppable</button>

<script>
  $(function() {
    $("#draggable").draggable();
    $("#droppable").droppable({
      drop: function() { $(this).addClass("ui-state-highlight").find("p").html("Dropped!"); }
    });
    $("#datepicker").datepicker();
    
    $("#toggle").click(function() {
      $("#droppable").fadeToggle();
    });
  });
</script>

</body>
</html>
